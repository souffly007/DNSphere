<svg xmlns="http://www.w3.org/2000/svg" width="420" height="1120" viewBox="0 0 420 1120" role="img" aria-labelledby="title desc">
  <title id="title">Écran principal de DNSphere</title>
  <desc id="desc">Interface sombre DNSphere avec protection DNS, statistiques, options de filtrage et accès rapide.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1020"/><stop offset="1" stop-color="#11162a"/></linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9b7cff"/><stop offset="1" stop-color="#5b55e8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".24"/></filter>
    <style>.white{fill:#f8f8ff;font-family:sans-serif}.muted{fill:#9299b4;font-family:sans-serif}.card{fill:#181d32;stroke:#303650;stroke-width:1}.label{fill:#9299b4;font-family:sans-serif;font-size:11px;font-weight:700;letter-spacing:1.2px}</style>
  </defs>
  <rect width="420" height="1120" rx="30" fill="url(#background)"/>
  <!-- En-tête -->
  <path d="M42 52v28l13 8 13-8V52L55 44z" fill="none" stroke="url(#shield)" stroke-width="3"/><path d="M55 54v22" stroke="#b9adff" stroke-width="2"/>
  <text x="82" y="63" class="white" font-size="23" font-weight="700">DNSphere</text><text x="82" y="84" class="muted" font-size="13">Protection désactivée</text><circle cx="380" cy="67" r="5" fill="#ef596d"/>
  <!-- Carte principale -->
  <rect x="20" y="108" width="380" height="300" rx="24" class="card" filter="url(#shadow)"/><text x="210" y="143" text-anchor="middle" class="label">PROTECTION DNS</text>
  <circle cx="210" cy="243" r="74" fill="#24263d" stroke="#3b3e5c" stroke-width="2"/><circle cx="210" cy="243" r="63" fill="#6b3f50" stroke="#e05c69" stroke-width="6"/>
  <text x="210" y="239" text-anchor="middle" class="white" font-size="17" font-weight="700">DÉSACTIVÉ</text><text x="210" y="268" text-anchor="middle" fill="#ffd9de" font-family="sans-serif" font-size="12">Protection en pause</text>
  <text x="210" y="342" text-anchor="middle" class="white" font-size="17" font-weight="700">DNS Standard</text><text x="210" y="364" text-anchor="middle" class="muted" font-size="12">Serveur DNS actif</text>
  <!-- Statistiques -->
  <rect x="20" y="424" width="380" height="172" rx="20" class="card"/><text x="38" y="454" class="label">AUJOURD'HUI</text>
  <text x="38" y="498" fill="#9b7cff" font-family="sans-serif" font-size="26" font-weight="700">0</text><text x="38" y="520" class="muted" font-size="12">Publicités bloquées</text>
  <text x="205" y="498" fill="#63a9ff" font-family="sans-serif" font-size="26" font-weight="700">0</text><text x="205" y="520" class="muted" font-size="12">Trackers bloqués</text><text x="375" y="502" text-anchor="middle" class="muted" font-size="27">›</text>
  <line x1="38" y1="546" x2="382" y2="546" stroke="#303650"/><text x="38" y="574" class="white" font-size="13" font-weight="700">Total : 0 bloqués</text><text x="382" y="574" text-anchor="end" class="muted" font-size="12">Autres : 0</text>
  <!-- Protection -->
  <text x="20" y="634" class="label">PROTECTION</text><rect x="20" y="650" width="380" height="205" rx="20" class="card"/>
  <text x="38" y="686" class="white" font-size="15">Bloquer les publicités</text><text x="38" y="705" class="muted" font-size="11">Réduire les contenus publicitaires</text><rect x="344" y="674" width="38" height="22" rx="12" fill="#7157e8"/><circle cx="371" cy="685" r="8" fill="#fff"/>
  <line x1="38" y1="725" x2="382" y2="725" stroke="#303650"/><text x="38" y="761" class="white" font-size="15">Bloquer les trackers</text><text x="38" y="780" class="muted" font-size="11">Limiter le pistage en ligne</text><rect x="344" y="749" width="38" height="22" rx="12" fill="#7157e8"/><circle cx="371" cy="760" r="8" fill="#fff"/>
  <line x1="38" y1="800" x2="382" y2="800" stroke="#303650"/><text x="38" y="836" class="white" font-size="15">Bloquer les malwares</text><text x="38" y="855" class="muted" font-size="11">Protection contre les domaines dangereux</text><rect x="344" y="824" width="38" height="22" rx="12" fill="#7157e8"/><circle cx="371" cy="835" r="8" fill="#fff"/>
  <!-- Accès rapide -->
  <text x="20" y="900" class="label">ACCÈS RAPIDE</text><rect x="20" y="916" width="185" height="52" rx="8" fill="#181d32" stroke="#303650"/><rect x="215" y="916" width="185" height="52" rx="8" fill="#181d32" stroke="#303650"/><rect x="20" y="978" width="185" height="52" rx="8" fill="#181d32" stroke="#303650"/><rect x="215" y="978" width="185" height="52" rx="8" fill="#181d32" stroke="#303650"/>
  <text x="112" y="948" text-anchor="middle" class="white" font-size="12">📊  Activité</text><text x="307" y="948" text-anchor="middle" class="white" font-size="12">✓  Autorisés</text><text x="112" y="1010" text-anchor="middle" class="white" font-size="12">📱  Applications</text><text x="307" y="1010" text-anchor="middle" class="white" font-size="12">⚙  Paramètres</text>
  <text x="210" y="1072" text-anchor="middle" class="muted" font-size="10">DNSphere · Protection DNS locale</text><text x="210" y="1092" text-anchor="middle" fill="#9b7cff" font-family="sans-serif" font-size="10">Code source · GitHub</text>
</svg>
